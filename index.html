<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fa">
  <title>Middlemaniac | Canonical integrations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body class="bg-body-tertiary text-body">
  <input id="canonical-file" type="file" accept=".json,application/json" aria-label="Choose canonical mappings JSON file" class="visually-hidden">
  <main class="container py-3">
    <section class="card position-relative p-4 pt-5" aria-label="Canonical mapping workspace">
      <div class="position-absolute top-0 end-0 d-flex gap-2 m-3">
        <button class="btn btn-sm btn-light border-secondary-subtle" id="load-sample-mappings" type="button" aria-label="Load sample mappings" title="Load sample mappings"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 2.5 1.8 5.2 5.2 1.8-5.2 1.8L10 16.5l-1.8-5.2L3 9.5l5.2-1.8L10 2.5Zm5.5 10 .8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8.8-1.7Z"/></svg></button>
        <button class="btn btn-sm btn-light border-secondary-subtle" id="import-canonical" type="button" aria-label="Import canonical mappings" title="Import canonical mappings"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12V3m0 0L7 6m3-3 3 3M4 11v5h12v-5"/></svg></button>
        <button class="btn btn-sm btn-light border-secondary-subtle" id="export-canonical" type="button" aria-label="Export canonical mappings" title="Export canonical mappings" disabled><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v9m0 0 3-3m-3 3L7 9M4 14v2h12v-2"/></svg></button>
        <button class="btn btn-sm btn-outline-danger" id="clear-canonical" type="button" aria-label="Clear canonical mappings" title="Clear canonical mappings" disabled><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6h11m-9.5 0 .7 10h7.6l.7-10M8 6V4h4v2m-3 3v4m2-4v4"/></svg></button>
      </div>
      <div class="container-fluid px-0" id="detail-pane" aria-live="polite"></div>
    </section>
  </main>

  <template id="canonical-detail-template">
    <div class="container-fluid px-0">
      <div class="border-bottom pb-3 d-none" data-detail-heading>
        <span class="font-monospace text-uppercase small text-body-secondary" data-record-category></span>
        <h2 class="h3 mb-0 mt-1 text-success-emphasis text-break" data-record-model></h2>
      </div>
      <div class="integration-mappings row g-4 mt-4 pt-3 border-top" data-mapping-groups></div>
      <div data-flow-slot></div>
    </div>
  </template>

  <template id="canonical-mapping-group-template">
    <section class="mapping-group col-6" data-mapping-group>
      <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
        <div>
          <span class="font-monospace small text-uppercase text-body-secondary" data-mapping-direction-label></span>
          <h3 class="h6 mb-0 mt-1" data-mapping-title></h3>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge rounded-pill text-bg-success" data-mapping-count></span>
          <button class="btn btn-sm btn-outline-secondary p-1" type="button" data-action="add-inbound-mapping" aria-label="Add mapping" title="Add mapping">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
          </button>
        </div>
      </div>
      <div class="list-group list-group-flush" data-mapping-rows></div>
      <div data-inline-form-slot></div>
    </section>
  </template>

  <template id="canonical-mapping-row-template">
    <div class="list-group-item border-0 border-bottom rounded-0 px-0 py-2 d-flex align-items-center gap-2">
      <span class="flex-grow-1 text-break fw-semibold" data-mapping-system></span>
      <a class="btn btn-link btn-sm p-0 text-nowrap" data-mapping-open target="_blank" rel="noopener noreferrer">Open<span aria-hidden="true"> ↗</span></a>
      <button class="btn btn-sm btn-outline-secondary p-1" type="button" data-remove-mapping="inbound" aria-label="Remove mapping" title="Remove mapping">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6h11m-9.5 0 .7 10h7.6l.7-10M8 6V4h4v2m-3 3v4m2-4v4"/></svg>
      </button>
    </div>
  </template>

  <template id="canonical-mapping-form-template">
    <form class="input-group input-group-sm mt-2" data-mapping-form="inbound">
      <input class="form-control" data-inline-mapping-system type="text" maxlength="80" aria-label="Source system" placeholder="Source system" required>
      <button class="btn btn-success" type="submit" aria-label="Add mapping" title="Add mapping">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>
      </button>
      <button class="btn btn-outline-secondary" type="button" data-action="cancel-mapping" aria-label="Cancel" title="Cancel">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
      </button>
    </form>
  </template>

  <template id="canonical-flow-template">
    <section class="canonical-visualization position-relative d-grid align-items-start gap-3 border rounded bg-body-tertiary p-3 mt-4" aria-label="Mapping flow">
      <div class="canonical-flow-side position-relative align-self-stretch z-1">
        <span class="position-absolute top-0 w-100 text-center font-monospace small text-uppercase text-body-secondary">Inbound mappings</span>
        <div class="canonical-flow-nodes d-flex flex-column gap-2" data-flow-inbound-list></div>
      </div>
      <svg class="flow-connectors position-absolute top-0 start-0 w-100 h-100 pe-none z-0 overflow-visible" aria-hidden="true">
        <defs>
          <marker id="flow-arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 8 4 0 8Z" fill="#91aa98"/>
          </marker>
        </defs>
      </svg>
      <div class="flow-canonical position-relative align-self-center mw-100 z-1 border border-success-subtle rounded bg-success-subtle p-2 text-center text-success-emphasis text-break" data-flow-model></div>
      <div class="canonical-flow-side position-relative align-self-stretch z-1">
        <span class="position-absolute top-0 w-100 text-center font-monospace small text-uppercase text-body-secondary">Outbound mappings</span>
        <div class="canonical-flow-nodes d-flex flex-column gap-2" data-flow-outbound-list></div>
      </div>
    </section>
  </template>

  <template id="canonical-flow-node-template">
    <div class="align-self-center mw-100 border rounded bg-white px-2 py-2 text-center text-break" data-flow-node></div>
  </template>

  <dialog class="dialog-surface sample-dialog" id="sample-dialog" aria-labelledby="sample-dialog-title">
    <div class="card shadow">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between gap-3 mb-2"><h2 class="h5 mb-0" id="sample-dialog-title">Sample mappings</h2><button class="btn btn-sm btn-outline-secondary icon-button" id="close-samples" type="button" aria-label="Close sample mappings" title="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
        <div class="list-group list-group-flush">
          <button class="list-group-item list-group-item-action d-flex align-items-center justify-content-between gap-3" type="button" data-sample-model="Taxable"><strong>Taxable</strong><span class="text-body-secondary small">3 inbound · 3 outbound</span></button>
          <button class="list-group-item list-group-item-action d-flex align-items-center justify-content-between gap-3" type="button" data-sample-model="Shipable"><strong>Shipable</strong><span class="text-body-secondary small">1 inbound · 2 outbound</span></button>
          <button class="list-group-item list-group-item-action d-flex align-items-center justify-content-between gap-3" type="button" data-sample-model="Payble"><strong>Payble</strong><span class="text-body-secondary small">1 inbound · 2 outbound</span></button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="dialog-surface canonical-export-dialog" id="canonical-export-dialog" aria-labelledby="canonical-export-title">
    <div class="card shadow">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between gap-3">
          <h2 class="h5 mb-0" id="canonical-export-title">Export canonical mappings</h2>
          <button class="btn btn-sm btn-outline-secondary icon-button" id="close-canonical-export" type="button" aria-label="Close export preview" title="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
        </div>
        <label class="form-label mt-3" for="canonical-export-preview">JSON preview</label>
        <textarea class="form-control font-monospace" id="canonical-export-preview" rows="14" readonly spellcheck="false"></textarea>
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button class="btn btn-light border-secondary-subtle" id="cancel-canonical-export" type="button">Cancel</button>
          <button class="btn btn-success" id="download-canonical-export" type="button">Download JSON</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="dialog-surface clear-dialog" id="clear-dialog" aria-labelledby="clear-dialog-title" aria-describedby="clear-dialog-description">
    <div class="card shadow">
      <div class="card-body">
        <h2 class="h5" id="clear-dialog-title">Clear canonical mappings?</h2>
        <p class="mb-4 text-body-secondary" id="clear-dialog-description">This removes all canonical mappings saved in this browser.</p>
        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-light border-secondary-subtle" id="cancel-clear" type="button">Cancel</button>
          <button class="btn btn-danger" id="confirm-clear" type="button">Clear mappings</button>
        </div>
      </div>
    </div>
  </dialog>

  <div class="alert alert-success position-fixed bottom-0 end-0 m-3 shadow z-3 d-none" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
